name: Docs CI
on:
    push:
        branches: [main]
        paths:
            - "docs/**"

    pull_request:
        branches: [main]
        paths:
            - "docs/**"

permissions:
    contents: read

jobs:
    verify_files:
        name: Verify Docs Files
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: "24" # Should be the same as the version used on Netlify to build the docs site

            - name: Install Docs Packages
              working-directory: docs
              run: npm install

            - name: Install Packages
              run: npm install

            - name: Stylelint Docs
              working-directory: docs
              run: npm run lint:scss

            - name: Build Docs Website
              working-directory: docs
              run: npm run build

            # Reads `docs/lychee.toml`, the same config `npm run lint:links` uses
            # locally. Version is pinned so config keys and the pretty-URL
            # resolution behaviour stay reproducible.
            - name: Validate internal links
              uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
              with:
                  workingDirectory: docs
                  args: _site
                  lycheeVersion: v0.24.2
                  fail: true
