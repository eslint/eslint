name: Update Test Ecosystem Plugins

on:
    schedule:
        # “At 00:00 on Monday.” https://crontab.guru/#0_0_*_*_1
        - cron: "0 0 * * 1"
    workflow_dispatch: ~

permissions:
    contents: write
    pull-requests: write

jobs:
    test_ecosystem:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "lts/*"
            - run: npm install
            - run: npm run test:ecosystem:update
            - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
              with:
                  token: ${{ secrets.WORKFLOW_PUSH_BOT_TOKEN }}
                  commit-message: "chore: update ecosystem plugins"
                  title: "chore: update ecosystem plugins"
                  branch: update-ecosystem-plugins
                  branch-suffix: timestamp
                  body: |
                      Updates test ecosystem plugins.

                      This PR is autogenerated by the "Update Test Ecosystem Plugins" GitHub Action.
