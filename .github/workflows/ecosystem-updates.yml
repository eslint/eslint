name: Update Test Ecosystem Plugins

on:
    schedule:
        # “At 00:00 on Monday.” https://crontab.guru/#0_0_*_*_1
        - cron: "0 0 * * 1"
    workflow_dispatch: ~

permissions:
    contents: write
    pull-requests: write

jobs:
    test_ecosystem:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"
            - run: npm install
            - run: npm run test:ecosystem:update
            - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
              with:
                  token: ${{ secrets.WORKFLOW_PUSH_BOT_TOKEN }}
                  commit-message: "chore: update ecosystem plugins"
                  title: "chore: update ecosystem plugins"
                  branch: update-ecosystem-plugins
                  branch-suffix: timestamp
                  body: |
                      Updates test ecosystem plugins.

                      This PR is autogenerated by the "Update Test Ecosystem Plugins" GitHub Action.
