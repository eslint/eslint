name: Types Integration CI
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    neostandard:
        name: Types (neostandard)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout eslint
              uses: actions/checkout@v7
              with:
                  path: eslint

            - name: Checkout neostandard
              uses: actions/checkout@v7
              with:
                  repository: neostandard/neostandard
                  path: neostandard

            - uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"

            - name: Install Packages (eslint)
              working-directory: eslint
              run: npm install

            - name: Install Packages (neostandard)
              working-directory: neostandard
              run: |
                  npm ci && npm install --no-save ../eslint

            - name: Run TSC
              working-directory: neostandard
              run: npm run check:tsc

    eslint-flat-config-utils:
        name: Types (eslint-flat-config-utils)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout eslint
              uses: actions/checkout@v7
              with:
                  path: eslint

            - name: Checkout eslint-flat-config-utils
              uses: actions/checkout@v7
              with:
                  repository: antfu/eslint-flat-config-utils
                  path: antfu

            - uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"

            - name: Install Corepack latest
              run: |
                  npm install -g corepack@latest
                  corepack enable pnpm

            - name: Install Packages (eslint)
              working-directory: eslint
              run: npm install

            - name: Install Packages (eslint-flat-config-utils)
              working-directory: antfu
              run: |
                  pnpm add -w -D ../eslint

            - name: Run TSC
              working-directory: antfu
              run: pnpm run typecheck

    eslint-visitor-keys:
        name: Types (eslint-visitor-keys)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout eslint
              uses: actions/checkout@v7
              with:
                  path: eslint

            - name: Checkout eslint/js
              uses: actions/checkout@v7
              with:
                  repository: eslint/js
                  path: eslint-js

            - uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"

            - name: Install Packages (eslint)
              working-directory: eslint
              run: npm install

            - name: Update package.json eslint-visitor-keys
              uses: restackio/update-json-file-action@6f50afee9a03a456a30cd574123db793319f7544 # 2.1
              with:
                  file: eslint-js/packages/eslint-visitor-keys/package.json
                  fields: '{"scripts.prepare": "npm run build:cjs"}'

            - name: Install Packages (eslint/js)
              working-directory: eslint-js
              run: |
                  npm install ../eslint

            - name: Run TSC
              working-directory: eslint-js
              run: npm run build:types --workspace eslint-visitor-keys

    eslint_json:
        name: Types (@eslint/json)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout eslint
              uses: actions/checkout@v7
              with:
                  path: eslint

            - name: Checkout @eslint/json
              uses: actions/checkout@v7
              with:
                  repository: eslint/json
                  path: json

            - uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"

            - name: Install Packages (eslint)
              working-directory: eslint
              run: npm install

            - name: Install Packages (@eslint/json)
              working-directory: json
              run: |
                  npm install
                  npm run build
                  npm install ../eslint @eslint/core@latest

            - name: Run TSC
              working-directory: json
              run: npm run test:types

    html_plugin:
        name: Types (@html-eslint/eslint-plugin)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout eslint
              uses: actions/checkout@v7
              with:
                  path: eslint

            - name: Checkout html-eslint
              uses: actions/checkout@v7
              with:
                  repository: yeonjuan/html-eslint
                  path: html-eslint

            - uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"

            - name: Install Packages (eslint)
              working-directory: eslint
              run: npm install

            - name: Patch html-eslint package.json
              uses: restackio/update-json-file-action@6f50afee9a03a456a30cd574123db793319f7544 # 2.1
              with:
                  file: html-eslint/package.json
                  fields: '{"resolutions.eslint":"file:../eslint"}'

            - name: Install Packages (html-eslint)
              working-directory: html-eslint
              run: yarn install --no-immutable

            - name: Run TSC
              working-directory: html-eslint
              run: yarn check:ts --filter=@html-eslint/eslint-plugin

    eslint_css:
        name: Types (@eslint/css)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout eslint
              uses: actions/checkout@v7
              with:
                  path: eslint

            - name: Checkout @eslint/css
              uses: actions/checkout@v7
              with:
                  repository: eslint/css
                  path: css

            - uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"

            - name: Install Packages (eslint)
              working-directory: eslint
              run: npm install

            - name: Install Packages (@eslint/css)
              working-directory: css
              run: |
                  npm install
                  npm run build
                  npm install ../eslint @eslint/core@latest

            - name: Run TSC
              working-directory: css
              run: npm run test:types

    eslint_markdown:
        name: Types (@eslint/markdown)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout eslint
              uses: actions/checkout@v7
              with:
                  path: eslint

            - name: Checkout @eslint/markdown
              uses: actions/checkout@v7
              with:
                  repository: eslint/markdown
                  path: markdown

            - uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"

            - name: Install Packages (eslint)
              working-directory: eslint
              run: npm install

            - name: Install Packages (@eslint/markdown)
              working-directory: markdown
              run: |
                  npm install
                  npm run build
                  npm install ../eslint @eslint/core@latest

            - name: Run TSC
              working-directory: markdown
              run: npm run test:types

    # https://github.com/eslint/eslint/issues/19418
    eslint_types_with_pnpm:
        name: Types (pnpm with eslint plugin)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout eslint
              uses: actions/checkout@v7
              with:
                  path: eslint

            - name: Checkout pnpm-estree-types-issue
              uses: actions/checkout@v7
              with:
                  repository: snitin315/pnpm-estree-types-issue
                  path: pnpm-estree-types-issue

            - uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"

            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
              with:
                  version: latest

            - name: Install Packages (eslint)
              working-directory: eslint
              run: npm install

            - name: Patch pnpm-estree-types-issue package.json
              uses: restackio/update-json-file-action@6f50afee9a03a456a30cd574123db793319f7544 # 2.1
              with:
                  file: pnpm-estree-types-issue/package.json
                  fields: '{"devDependencies.eslint":"file:../eslint"}'

            - name: Install Packages (pnpm-estree-types-issue)
              working-directory: pnpm-estree-types-issue
              run: rm pnpm-lock.yaml && pnpm install

            - name: Run TSC
              working-directory: pnpm-estree-types-issue
              run: pnpm run test:types

    are-the-types-wrong:
        name: Are the types wrong?
        runs-on: ubuntu-latest

        strategy:
            matrix:
                package:
                    [
                        { name: eslint, directory: . },
                        {
                            name: eslint-config-eslint,
                            directory: packages/eslint-config-eslint,
                        },
                    ]

        steps:
            - name: Checkout ${{ matrix.package.name }}
              uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: "lts/*"

            - name: Install Packages
              working-directory: ${{ matrix.package.directory }}
              run: npm install

            - name: Check validity of type definitions
              working-directory: ${{ matrix.package.directory }}
              run: npm run lint:types
